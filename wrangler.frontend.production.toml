# Production frontend Worker. Deploy only with:
#   npx wrangler deploy --config wrangler.frontend.production.toml --keep-vars
# --keep-vars preserves FPAI_CONTROL_TOKEN. Do not set LOCAL_DEV and do not
# put the control token in [vars]. Owner-only Cloudflare Access and the
# VIDEO_ADAPTER service binding must stay enabled.
name = "fpai-film-studio"
main = "frontend-worker/index.js"
compatibility_date = "2026-09-04"
workers_dev = true

[vars]
ACCESS_TEAM_DOMAIN = "black-dream-df71.cloudflareaccess.com"
ACCESS_AUD = "ce69ac4d6fad40fd463939b248b4dbec611d2e315370486dc00a03782d680d47"
VIDEO_ADAPTER_URL = "https://fpai-film-studio-video-adapter.tjfalkahn.workers.dev"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
html_handling = "auto-trailing-slash"
run_worker_first = true

[[services]]
binding = "VIDEO_ADAPTER"
service = "fpai-film-studio-video-adapter"
