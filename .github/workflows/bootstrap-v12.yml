name: Bootstrap Film Studio v1.2

on:
  push:
    branches:
      - feature/generation-economy-engine-v1.2

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Materialize reviewed source package
        shell: bash
        run: |
          set -euo pipefail
          cat .fpai-payload/v12.part-* | base64 --decode > /tmp/fpai-film-studio-v12.tar.gz
          tar -tzf /tmp/fpai-film-studio-v12.tar.gz >/dev/null
          tar -xzf /tmp/fpai-film-studio-v12.tar.gz
          rm -rf .fpai-payload .github/workflows/bootstrap-v12.yml
          git diff --check

      - name: Verify tests and production build
        run: |
          npm ci
          npm test
          npm run build

      - name: Commit verified implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "FPAI Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "feat: add generation economy engine v1.2"
          git push origin HEAD:"${GITHUB_REF_NAME}"
