name: Materialize Film Studio v1.2

on:
  push:
    branches:
      - feature/generation-economy-engine-v1.2

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materialize the already-verified source package
        shell: bash
        run: |
          set -euo pipefail
          cat .fpai-payload/v12.part-* | base64 --decode > /tmp/fpai-film-studio-v12.tar.gz
          echo "82b09b8d946f9abf73e27e34fcaced99a728e2e05f8f6423a5c38978ed37cc99  /tmp/fpai-film-studio-v12.tar.gz" | sha256sum -c -
          tar -tzf /tmp/fpai-film-studio-v12.tar.gz >/dev/null
          tar -xzf /tmp/fpai-film-studio-v12.tar.gz
          rm -rf .fpai-payload .github/workflows/ci.yml dist node_modules
          git diff --check

      - name: Commit materialized implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "FPAI Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "feat: add generation economy engine v1.2"
          git push origin HEAD:"${GITHUB_REF_NAME}"
