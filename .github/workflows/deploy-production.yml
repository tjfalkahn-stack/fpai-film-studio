name: Deploy Film Studio production

on:
  workflow_dispatch:
  # Keep production synchronized after a verified merge.
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"

permissions:
  contents: read

concurrency:
  group: fpai-film-studio-production
  cancel-in-progress: false

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run typecheck
      - run: npm run build

      - name: Prepare production configuration
        shell: bash
        run: |
          cat > wrangler.deploy.toml <<'EOF'
          name = "fpai-film-studio-video-adapter"
          main = "worker/index.js"
          compatibility_date = "2026-09-04"

          [vars]
          # Preserve the existing live-rendering gates with --keep-vars below.
          # Missing values fail closed in the adapter on a fresh deployment.
          MOCK_E2E_VERIFIED = "true"
          RENDER_PROJECT_ID = "enemies-closer-ep01"
          RENDER_PROJECT_CEILING_USD = "25"
          RENDER_SESSION_CEILING_USD = "10"
          RENDER_SESSION_ID = "studio-audio-2026"
          MAX_SINGLE_JOB_USD = "4"
          VEO_NEW_SUBMISSIONS_PAUSED = "false"
          LTX_FAST_720P_RATE_PER_SECOND_USD = "0.09"
          LTX_FAST_1080P_RATE_PER_SECOND_USD = "0.13"
          LTX_PRO_720P_RATE_PER_SECOND_USD = "0.12"
          LTX_PRO_1080P_RATE_PER_SECOND_USD = "0.17"

          [[d1_databases]]
          binding = "GENERATION_DB"
          database_name = "fpai-film-studio-generation"
          database_id = "c7aa2548-3d3c-4379-b1ff-3b5ab19e5acc"

          [[r2_buckets]]
          binding = "GENERATION_MEDIA"
          bucket_name = "fpai-film-studio-generation-media"
          EOF

          cp wrangler.frontend.production.toml wrangler.frontend.deploy.toml
          node scripts/frontend-production-config.mjs

      - name: Deploy video adapter
        run: npx wrangler deploy --config wrangler.deploy.toml --keep-vars
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "923ec9549d7b93161155bd4d207fbd9f"

      - name: Deploy frontend
        run: npx wrangler deploy --config wrangler.frontend.production.toml --keep-vars
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "923ec9549d7b93161155bd4d207fbd9f"

      - name: Smoke test adapter
        run: |
          curl --fail --silent --show-error --retry 4 --retry-delay 3 \
            https://fpai-film-studio-video-adapter.tjfalkahn.workers.dev/health
          echo
          curl --fail --silent --show-error \
            https://fpai-film-studio-video-adapter.tjfalkahn.workers.dev/health/veo

      - name: Inspect recent Veo renders (read-only D1)
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "923ec9549d7b93161155bd4d207fbd9f"
        run: |
          set -euo pipefail
          SQL=$(cat <<'SQL'
          SELECT id, status, provider, model,
                 estimated_cost, actual_cost, reserved_cost, operation_id,
                 substr(error_json,1,2500) AS error_json,
                 json_extract(input_json,'$.projectId') AS project_id,
                 json_extract(input_json,'$.sceneId') AS scene_id,
                 json_extract(input_json,'$.shotId') AS shot_id,
                 json_extract(input_json,'$.duration') AS duration,
                 json_extract(input_json,'$.resolution') AS resolution,
                 json_extract(input_json,'$.aspectRatio') AS aspect_ratio,
                 json_extract(input_json,'$.referenceMode') AS reference_mode,
                 json_extract(input_json,'$.referenceImages[0].mimeType') AS ref0_mime,
                 json_array_length(json_extract(input_json,'$.referenceImages')) AS ref_count,
                 substr(COALESCE(json_extract(input_json,'$.prompt'),''),1,400) AS prompt_prefix,
                 created_at, updated_at
          FROM renders
          WHERE provider LIKE 'veo%'
            AND created_at LIKE '2026-10-02%'
          ORDER BY created_at DESC
          LIMIT 40;
          SQL
          )
          npx wrangler d1 execute fpai-film-studio-generation --remote --config wrangler.deploy.toml --json --command "$SQL" | tee /tmp/veo-renders.json
          python3 - <<'PY'
          import json
          raw=json.load(open("/tmp/veo-renders.json"))
          rows=[]
          if isinstance(raw, list):
            for block in raw:
              rows.extend(block.get("results") or block.get("result") or [])
              if isinstance(block.get("result"), list):
                for item in block["result"]:
                  if isinstance(item, dict) and "results" in item:
                    rows.extend(item["results"])
          print("=== VEO RENDER ROWS ===")
          print("count:", len(rows))
          for row in rows:
            print("---")
            for k in ["id","created_at","updated_at","status","provider","model","estimated_cost","actual_cost","reserved_cost","operation_id","project_id","scene_id","shot_id","duration","resolution","aspect_ratio","reference_mode","ref0_mime","ref_count","prompt_prefix","error_json"]:
              if k in row: print(f"{k}: {row[k]}")
          print("=== END VEO RENDER ROWS ===")
          PY

      # Read-only: uses the adapter's GEMINI_API_KEY via service binding. Never predictLongRunning.
      # continue-on-error: operation records expire; do not block production deploys.
      - name: Diagnose failed Veo operation (read-only)
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "923ec9549d7b93161155bd4d207fbd9f"
          VEO_OPERATION: models/veo-3.1-fast-generate-preview/operations/bwq9vmmq1qvk
          VEO_JOB_ID: f80a73e3-0113-4228-9f31-ca61a9d6aea1
        run: |
          set -euo pipefail
          TOKEN="$(openssl rand -hex 24)"
          echo "::add-mask::$TOKEN"
          cleanup() {
            printf '%s' "$TOKEN" | npx wrangler secret delete DIAGNOSE_RUN_TOKEN --name fpai-film-studio-video-adapter --force >/dev/null 2>&1 || true
            npx wrangler delete fpai-film-studio-veo-diagnose --force || true
          }
          trap cleanup EXIT
          # Temporary one-shot gate on the adapter (deleted in cleanup). Not the Gemini key.
          printf '%s' "$TOKEN" | npx wrangler secret put DIAGNOSE_RUN_TOKEN --name fpai-film-studio-video-adapter
          cat > wrangler.veo-diagnose.toml <<EOF
          name = "fpai-film-studio-veo-diagnose"
          main = "scripts/veo-diagnose-worker.js"
          compatibility_date = "2026-09-04"
          workers_dev = true

          [vars]
          DIAGNOSE_RUN_TOKEN = "$TOKEN"

          [[services]]
          binding = "ADAPTER"
          service = "fpai-film-studio-video-adapter"
          EOF
          npx wrangler deploy --config wrangler.veo-diagnose.toml
          sleep 10
          QUERY="token=${TOKEN}&operation=$(python3 -c 'import os,urllib.parse; print(urllib.parse.quote(os.environ["VEO_OPERATION"], safe=""))')&jobId=$(python3 -c 'import os,urllib.parse; print(urllib.parse.quote(os.environ["VEO_JOB_ID"], safe=""))')"
          URL="https://fpai-film-studio-veo-diagnose.tjfalkahn.workers.dev/?${QUERY}"
          CODE="000"
          for attempt in 1 2 3 4 5 6 7 8; do
            CODE=$(curl --silent --show-error --output /tmp/veo-diagnose.json --write-out "%{http_code}" "$URL" || true)
            echo "diagnose attempt ${attempt}: HTTP ${CODE}"
            if [ "$CODE" = "200" ]; then
              break
            fi
            cat /tmp/veo-diagnose.json || true
            echo
            sleep 5
          done
          if [ "$CODE" != "200" ]; then
            echo "Diagnose caller did not return HTTP 200 (last=${CODE})"
            exit 1
          fi
          python3 - <<'PY'
          import json, sys
          data = json.load(open("/tmp/veo-diagnose.json"))
          if data.get("ok") is not True:
              print("DIAGNOSE_PAYLOAD:", json.dumps(data, indent=2)[:4000])
              sys.exit(1)
          assert data.get("generationStarted") is False, data
          filt = data.get("filter") or {}
          print("=== VEO FILTER DIAGNOSIS ===")
          print("operation:", data.get("operation"))
          print("jobId:", data.get("jobId"))
          print("authVia:", data.get("authVia"))
          print("done:", data.get("done"))
          print("hasVideo:", data.get("hasVideo"))
          print("filtered:", filt.get("filtered"))
          print("raiMediaFilteredCount:", filt.get("raiMediaFilteredCount"))
          print("supportCodes:", filt.get("supportCodes"))
          for reason in filt.get("raiMediaFilteredReasons") or []:
              print("REASON:", reason)
          if filt.get("message"):
              print("MESSAGE:", filt["message"])
          if data.get("googleError"):
              print("GOOGLE_ERROR:", data["googleError"])
          print("=== END VEO FILTER DIAGNOSIS ===")
          PY
