name: Deploy Film Studio production

on:
  workflow_dispatch:
  # Keep production synchronized after a verified merge.
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"

permissions:
  contents: read

concurrency:
  group: fpai-film-studio-production
  cancel-in-progress: false

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run typecheck
      - run: npm run build

      - name: Prepare production configuration
        shell: bash
        run: |
          cat > wrangler.deploy.toml <<'EOF'
          name = "fpai-film-studio-video-adapter"
          main = "worker/index.js"
          compatibility_date = "2026-09-04"

          [vars]
          LIVE_RENDERING_ENABLED = "false"
          SEEDANCE_LIVE_ENABLED = "false"
          CHARACTER_FACTORY_LIVE_ENABLED = "false"

          [[d1_databases]]
          binding = "GENERATION_DB"
          database_name = "fpai-film-studio-generation"
          database_id = "c7aa2548-3d3c-4379-b1ff-3b5ab19e5acc"

          [[r2_buckets]]
          binding = "GENERATION_MEDIA"
          bucket_name = "fpai-film-studio-generation-media"
          EOF

          cat > wrangler.frontend.deploy.toml <<'EOF'
          name = "fpai-film-studio"
          main = "frontend-worker/index.js"
          compatibility_date = "2026-09-04"
          workers_dev = true

          [vars]
          ACCESS_TEAM_DOMAIN = "black-dream-df71.cloudflareaccess.com"
          ACCESS_AUD = "ce69ac4d6fad40fd463939b248b4dbec611d2e315370486dc00a03782d680d47"
          VIDEO_ADAPTER_URL = "https://fpai-film-studio-video-adapter.tjfalkahn.workers.dev"

          [assets]
          directory = "./dist"
          binding = "ASSETS"
          not_found_handling = "single-page-application"
          html_handling = "auto-trailing-slash"
          run_worker_first = true

          [[services]]
          binding = "VIDEO_ADAPTER"
          service = "fpai-film-studio-video-adapter"
          EOF

      - name: Deploy video adapter
        run: npx wrangler deploy --config wrangler.deploy.toml --keep-vars
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "923ec9549d7b93161155bd4d207fbd9f"

      - name: Deploy frontend
        run: npx wrangler deploy --config wrangler.frontend.deploy.toml --keep-vars
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "923ec9549d7b93161155bd4d207fbd9f"

      - name: Smoke test adapter
        run: |
          curl --fail --silent --show-error --retry 4 --retry-delay 3 \
            https://fpai-film-studio-video-adapter.tjfalkahn.workers.dev/health
